<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰度原型组件样本</title><link rel="icon" href="data:,"><link rel="stylesheet" href="components.css"><style>body{max-width:1100px;margin:auto;padding:36px 24px 60px;background:#f3f3ef}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:28px 0}.sample{background:white;padding:24px;border:1px solid #cccac2;border-radius:4px}.sample h2{font-size:16px;margin-bottom:16px}.wide{grid-column:1/-1}.swatches{display:flex;gap:12px}.swatch{height:40px;flex:1;border:1px solid #ccc}footer{font-size:12px;color:#777}@media(max-width:650px){.catalog{grid-template-columns:minmax(0,1fr)}body{padding:20px 14px}}</style></head><body><div class="between"><span class="mono">PROTOTYPE KIT / v1 / 第二轮规划组件</span><a href="../index.html">进入交互原型 →</a></div><h1 class="mt">一套固定组件，不同业务内容</h1><p class="sub">样式样本用于比较层级与密度；完整操作和流程引导请进入业务原型。</p><div id="samples" class="catalog"></div><footer>基础组件与业务分离。本目录是 product-ui 的可复用规划资产；具体模块、字段、状态与流程由项目配置。</footer><script src="components.js"></script><script>
const K=window.PrototypeKit;
const sample=(title,html,wide=false)=>`<section class="sample ${wide?'wide':''}"><h2>${title}</h2>${html}</section>`;
document.getElementById('samples').innerHTML=[
sample('01 / 中性色与文字层级','<div class="swatches"><div class="swatch" style="background:#30302e"></div><div class="swatch" style="background:#77776b"></div><div class="swatch" style="background:#c9c9c4"></div><div class="swatch" style="background:#f3f3ef"></div></div><p class="mt">正文描述任务与内容</p><p class="sub">辅助文字解释口径和上下文</p><p class="muted">注释只承载次要信息</p>'),
sample('02 / 操作层级','<div class="row">'+K.btn('主要操作','sample','','primary')+K.btn('次要操作','sample')+K.btn('暂不可用','sample','disabled')+K.btn('文字入口','sample','','link')+'</div><p class="sub">主要动作保持单一；禁用状态附带原因。</p>'),
sample('03 / 状态标记','<div class="row">'+K.pill('处理中')+K.pill('已接收')+K.pill('需要关注',true)+'</div><div class="notice mt">说明具体状态与下一步，不单靠颜色表达含义。</div>'),
sample('04 / 输入与选择','<div class="form-grid">'+K.field('名称','name','示例对象')+'<label class="field">处理状态<select>'+K.opts(['待处理','处理中','已完成'],'待处理')+'</select></label></div><label class="check"><input type="checkbox">明确确认处理方式</label>'),
sample('05 / 页头与上下文',K.pageHeader({id:'Pxx',module:'Mxx · 业务模块',title:'逻辑页面名称',sub:'对象范围 / 业务期间 / 当前状态',action:K.btn('页面主操作','sample','','primary'),back:'← 返回来源列表'}),true),
sample('06 / 表格与范围内操作',K.table(['对象名称','当前状态','所属范围','操作'],[K.tr(['示例对象 A',K.pill('处理中'),'范围一',K.btn('查看 →','sample')]),K.tr(['示例对象 B',K.pill('已完成'),'范围二',K.btn('查看 →','sample')])]),true),
sample('07 / 空状态',K.empty('没有符合条件的结果','保留用户已选范围，给出一个可恢复动作。',K.btn('清除筛选','sample'))),
sample('08 / 多步骤与反馈','<div class="steps"><span>1 填写</span><span class="current">2 校验</span><span>3 确认</span></div><div class="notice warning">还有一个问题需要处理。输入已保留。</div><div class="row mt">'+K.btn('返回修改','sample')+K.btn('确认提交','sample','disabled','primary')+'</div>')
].join('');
</script></body></html>
